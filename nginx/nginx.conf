user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile     on;
    gzip         on;
    gzip_types   text/plain text/css application/javascript application/wasm;

    access_log off;

    # Rate limiting: keyed on server address, NOT client IP
    limit_req_zone $server_addr zone=global:10m rate=20r/s;

    server {
        listen 80;
        listen [::]:80;
        listen unix:/run/torex-sock/nginx.sock;
        server_name _;

        limit_req zone=global burst=40 nodelay;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' wss:; img-src 'self' data:; frame-ancestors 'none'" always;

        # Flutter web app
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Health check endpoint — not rate limited
        location /healthz {
            access_log off;
            return 200 "ok";
        }

        # REST API
        location /api/ {
            proxy_pass         http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For "";
            proxy_set_header   X-Real-IP "";
            proxy_read_timeout 30s;
        }

        # WebSocket
        location /ws {
            proxy_pass         http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "Upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For "";
            proxy_set_header   X-Real-IP "";
            proxy_read_timeout 86400s;
        }
    }
}
