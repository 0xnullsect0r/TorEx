[toolchain]
# Pinned to 1.86 because wasm-bindgen-cli 0.2.121 (in Cargo.lock) requires rustc 1.86
# to compile. Using rust:1.86 in the Docker builder ensures the CLI and the compiled
# WASM are both from the same toolchain generation, avoiding the "clone_ref" error.
# Update this pin together with wasm-bindgen when upgrading the Rust toolchain.
channel = "1.86"
targets = ["wasm32-unknown-unknown"]
