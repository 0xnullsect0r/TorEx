name: torex
description: Privacy-focused USDT exchange
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^13.2.0
  dio: ^5.4.3
  web_socket_channel: ^3.0.0
  flutter_secure_storage: ^9.2.2
  hive_flutter: ^1.1.0
  bip39: ^1.0.6
  fl_chart: ^0.67.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.0
  local_auth: ^2.3.0
  google_fonts: ^6.2.1
  crypto: ^3.0.3
  convert: ^3.1.1
  uuid: ^4.4.0
  cached_network_image: ^3.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/wasm/
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
